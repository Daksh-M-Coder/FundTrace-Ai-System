.tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }

function buildDetailPanel(s) {
  return `
    <h2>${s.name}</h2>
    <div class="tabs">
      <button class="tab active" onclick="switchTab(event,'concept')">Concept</button>
      <button class="tab" onclick="switchTab(event,'guidelines')">Guidelines</button>
      <button class="tab" onclick="switchTab(event,'code')">CSS Code</button>
      <button class="tab" onclick="switchTab(event,'usecases')">Best For</button>
    </div>
    <div class="tab-content active" id="tab-concept">
      <div class="info-grid">
        <div class="info-box">
          <h4>Philosophy</h4>
          <p>${s.concept}</p>
        </div>
        <div class="info-box">
          <h4>Color Palette</h4>
          <ul>${s.colors.map(c => `<li>${c}</li>`).join('')}</ul>
        </div>
      </div>
    </div>
    <div class="tab-content" id="tab-guidelines">
      <div class="info-grid">
        <div class="info-box">
          <h4>✓ Do</h4>
          <ul>${s.dosArr.map(d=>`<li>${d}</li>`).join('')}</ul>
        </div>
        <div class="info-box">
          <h4>✗ Don't</h4>
          <ul>${s.dontsArr.map(d=>`<li>${d}</li>`).join('')}</ul>
        </div>
      </div>
    </div>
    <div class="tab-content" id="tab-code">
      <pre class="code-block">${s.css.replace(/</g,'&lt;')}</pre>
    </div>
    <div class="tab-content" id="tab-usecases">
      <div class="info-box">
        <h4>Best suited for</h4>
        <ul>${s.bestFor.map(b=>`<li>${b}</li>`).join('')}</ul>
      </div>
    </div>
  `;
}

function switchTab(e, id) {
  e.currentTarget.closest('.detail-panel').querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  e.currentTarget.closest('.detail-panel').querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  e.currentTarget.classList.add('active');
  document.getElementById('tab-'+id).classList.add('active');
}

let activeCard = null;
const grid = document.getElementById('styleGrid');
const panel = document.getElementById('detailPanel');

styles.forEach(s => {
  const card = document.createElement('div');
  card.className = 'style-card';
  card.dataset.id = s.id;
  card.innerHTML = `
    ${previews[s.id]}
    <div class="card-meta">
      <h3>${s.name}</h3>
      <p>${s.tagline}</p>
    </div>
  `;
  card.addEventListener('click', () => {
    if (activeCard) activeCard.classList.remove('active');
    card.classList.add('active');
    activeCard = card;
    panel.style.display = 'block';
    panel.innerHTML = buildDetailPanel(s);
    panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  grid.appendChild(card);
});
</script>
