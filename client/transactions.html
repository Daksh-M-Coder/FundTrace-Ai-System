<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transactions — FundTrace Bank</title>
<link rel="stylesheet" href="/client/css/app.css">
<style>
  .filter-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; align-items:center; }
  .filter-bar select, .filter-bar input { padding:6px 10px; border:0.5px solid var(--border-strong); border-radius:var(--radius-sm); background:var(--surface); font-size:13px; color:var(--text); cursor:pointer; }
  .txn-detail { display:none; position:fixed; right:0; top:54px; bottom:0; width:340px; background:var(--surface); border-left:0.5px solid var(--border); overflow-y:auto; padding:20px; z-index:200; }
  .txn-detail.open { display:block; }
  .detail-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:0.5px solid var(--border); font-size:13px; }
  .detail-row:last-child { border-bottom:none; }
  .detail-label { color:var(--text2); }
  .pagination { display:flex; gap:8px; align-items:center; justify-content:center; margin-top:20px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo"><span class="logo-dot"></span> FundTrace Bank</div>
  <nav style="display:flex; gap:4px; margin-left:16px;">
    <a href="/client/dashboard.html" class="nav-item" style="padding:6px 12px; font-size:13px;">Dashboard</a>
    <a href="/client/transactions.html" class="nav-item active" style="padding:6px 12px; font-size:13px;">Transactions</a>
    <a href="/client/friends.html" class="nav-item" style="padding:6px 12px; font-size:13px;">Connections</a>
  </nav>
  <div class="topbar-right">
    <span class="topbar-name" id="topbarName">—</span>
    <button class="btn btn-sm" onclick="logout()">Sign out</button>
  </div>
</div>

<!-- Transaction detail panel -->
<div class="txn-detail" id="detailPanel">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <span style="font-weight:600; font-size:15px;">Transaction Detail</span>
    <button class="btn btn-sm" onclick="closeDetail()">✕</button>
  </div>
  <div style="text-align:center; margin-bottom:20px;">
    <div id="detailIcon" style="font-size:40px; margin-bottom:8px;"></div>
    <div id="detailAmount" style="font-size:28px; font-weight:700;"></div>
    <div id="detailOther" style="font-size:13px; color:var(--text2); margin-top:4px;"></div>
  </div>
  <div id="detailRows"></div>
</div>

<div style="max-width:900px; margin:0 auto; padding:24px;">
  <div class="page-header">
    <div class="page-title">Transaction History</div>
    <div class="page-subtitle" id="pageSub">—</div>
  </div>

  <!-- Stats -->
  <div class="grid-3" style="margin-bottom:24px;">
    <div class="card" style="text-align:center; padding:16px;">
      <div style="font-size:11px; color:var(--text3); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.3px;">Total Sent</div>
      <div style="font-size:20px; font-weight:600; color:var(--danger-text);" id="sumSent">—</div>
    </div>
    <div class="card" style="text-align:center; padding:16px;">
      <div style="font-size:11px; color:var(--text3); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.3px;">Total Received</div>
      <div style="font-size:20px; font-weight:600; color:var(--success-text);" id="sumRecv">—</div>
    </div>
    <div class="card" style="text-align:center; padding:16px;">
      <div style="font-size:11px; color:var(--text3); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.3px;">Total Count</div>
      <div style="font-size:20px; font-weight:600;" id="sumCount">—</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filter-bar">
    <select id="filterType" onchange="applyFilters()">
      <option value="all">All transactions</option>
      <option value="sent">Sent only</option>
      <option value="received">Received only</option>
    </select>
    <select id="filterChannel" onchange="applyFilters()">
      <option value="">All channels</option>
      <option value="UPI">UPI</option>
      <option value="IMPS">IMPS</option>
      <option value="NEFT">NEFT</option>
      <option value="RTGS">RTGS</option>
    </select>
    <input type="date" id="filterFrom" onchange="applyFilters()" placeholder="From date">
    <input type="date" id="filterTo" onchange="applyFilters()" placeholder="To date">
    <input type="text" id="filterSearch" placeholder="Search name / txn ID..." oninput="applyFilters()" style="min-width:180px;">
    <button class="btn btn-sm" onclick="clearFilters()">Clear</button>
  </div>

  <div id="txnContainer">
    <div style="text-align:center;padding:40px;color:var(--text3);"><span class="spinner"></span></div>
  </div>

  <div class="pagination" id="pagination"></div>
</div>

<script src="/client/js/api.js"></script>
<script>
let currentUser = null;
let allTransactions = [];
let page = 0;
const PAGE_SIZE = 25;

async function init() {
  currentUser = await requireLogin('client');
  if (!currentUser) return;
  document.getElementById('topbarName').textContent = currentUser.full_name.split(' ')[0];
  document.getElementById('pageSub').textContent = currentUser.account_number + ' · ' + currentUser.unique_code;
  await loadAll();
}

async function loadAll() {
  try {
    const { transactions } = await api.get('/transactions/history?limit=500');
    allTransactions = transactions;

    const sent = transactions.filter(t => t.from_user_id === currentUser.id);
    const recv = transactions.filter(t => t.to_user_id === currentUser.id);
    document.getElementById('sumSent').textContent = formatCurrency(sent.reduce((s,t) => s+t.amount, 0));
    document.getElementById('sumRecv').textContent = formatCurrency(recv.reduce((s,t) => s+t.amount, 0));
    document.getElementById('sumCount').textContent = transactions.length;

    applyFilters();
  } catch (e) {
    document.getElementById('txnContainer').innerHTML = '<div class="empty-state"><div class="empty-state-text">Failed to load transactions</div></div>';
  }
}

function applyFilters() {
  const type = document.getElementById('filterType').value;
  const channel = document.getElementById('filterChannel').value;
  const fromDate = document.getElementById('filterFrom').value;
  const toDate = document.getElementById('filterTo').value;
  const search = document.getElementById('filterSearch').value.toLowerCase();

  let filtered = allTransactions.filter(t => {
    const isSent = t.from_user_id === currentUser.id;
    if (type === 'sent' && !isSent) return false;
    if (type === 'received' && isSent) return false;
    if (channel && t.channel !== channel) return false;
    if (fromDate && new Date(t.created_at * 1000) < new Date(fromDate)) return false;
    if (toDate && new Date(t.created_at * 1000) > new Date(toDate + 'T23:59:59')) return false;
    if (search) {
      const name = (isSent ? t.receiver_name : t.sender_name) || '';
      if (!name.toLowerCase().includes(search) && !t.txn_id.toLowerCase().includes(search) && !(t.note||'').toLowerCase().includes(search)) return false;
    }
    return true;
  });

  page = 0;
  renderPage(filtered);
}

function renderPage(txns) {
  const start = page * PAGE_SIZE;
  const pageData = txns.slice(start, start + PAGE_SIZE);
  const totalPages = Math.ceil(txns.length / PAGE_SIZE);

  if (!txns.length) {
    document.getElementById('txnContainer').innerHTML = '<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-text">No transactions match your filters</div></div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  document.getElementById('txnContainer').innerHTML = '<div class="txn-list">' + pageData.map(t => {
    const isSent = t.from_user_id === currentUser.id;
    const other = isSent ? (t.receiver_name || 'External') : (t.sender_name || 'External');
    const sign = isSent ? '-' : '+';
    const icon = isSent ? '↑' : '↓';
    const flagBadge = t.flagged ? ' <span class="badge badge-danger" style="font-size:10px;">⚠ Flagged</span>' : '';
    return `
      <div class="txn-item" onclick="showDetail('${t.txn_id}')" style="cursor:pointer;">
        <div class="txn-icon ${isSent ? 'sent' : 'received'}">${icon}</div>
        <div style="flex:1;">
          <div style="display:flex; align-items:center; gap:6px;">
            <span class="txn-name">${isSent ? 'To: ' : 'From: '}${other}</span>${flagBadge}
          </div>
          <div class="txn-meta">${t.channel} · ${formatDate(t.created_at)}${t.note ? ' · "' + t.note + '"' : ''}</div>
        </div>
        <div>
          <div class="txn-amount ${isSent ? 'sent' : 'received'}">${sign}${formatCurrency(t.amount)}</div>
          <div style="font-size:11px; color:var(--text3); text-align:right;">${t.txn_id}</div>
        </div>
      </div>`;
  }).join('') + '</div>';

  // Pagination
  if (totalPages > 1) {
    document.getElementById('pagination').innerHTML = `
      <button class="btn btn-sm" onclick="changePage(${page - 1}, ${JSON.stringify(txns).replace(/"/g,'&quot;')})" ${page === 0 ? 'disabled' : ''}>‹ Prev</button>
      <span style="font-size:13px; color:var(--text2);">Page ${page + 1} of ${totalPages} (${txns.length} total)</span>
      <button class="btn btn-sm" onclick="changePage(${page + 1}, ${JSON.stringify(txns).replace(/"/g,'&quot;')})" ${page >= totalPages - 1 ? 'disabled' : ''}>Next ›</button>
    `;
  } else {
    document.getElementById('pagination').innerHTML = `<span style="font-size:13px; color:var(--text3);">${txns.length} transaction${txns.length !== 1 ? 's' : ''}</span>`;
  }
}

function changePage(newPage, txns) {
  page = newPage;
  renderPage(typeof txns === 'string' ? JSON.parse(txns) : txns);
}

async function showDetail(txnId) {
  try {
    const { transaction: t } = await api.get('/transactions/' + txnId);
    const isSent = t.from_user_id === currentUser.id;
    const other = isSent ? t.receiver_name : t.sender_name;
    document.getElementById('detailIcon').textContent = isSent ? '↑' : '↓';
    document.getElementById('detailAmount').textContent = (isSent ? '−' : '+') + formatCurrency(t.amount);
    document.getElementById('detailAmount').style.color = isSent ? 'var(--danger-text)' : 'var(--success-text)';
    document.getElementById('detailOther').textContent = (isSent ? 'Sent to ' : 'Received from ') + other;
    document.getElementById('detailRows').innerHTML = [
      ['Transaction ID', t.txn_id],
      ['Date & Time', formatDate(t.created_at)],
      ['Channel', t.channel],
      ['From Account', t.from_account],
      ['To Account', t.to_account],
      ['Status', t.status],
      ['Note', t.note || '—'],
      ['Fraud Flag', t.flagged ? '⚠ Flagged (score: ' + Math.round(t.fraud_score) + ')' : 'None'],
    ].map(([label, val]) => `<div class="detail-row"><span class="detail-label">${label}</span><span style="font-weight:500; text-align:right; max-width:180px;">${val}</span></div>`).join('');
    document.getElementById('detailPanel').classList.add('open');
  } catch (e) {
    showToast('Could not load transaction detail', 'error');
  }
}

function closeDetail() { document.getElementById('detailPanel').classList.remove('open'); }

function clearFilters() {
  ['filterType','filterChannel','filterFrom','filterTo','filterSearch'].forEach(id => {
    const el = document.getElementById(id);
    if (el.tagName === 'SELECT') el.value = el.options[0].value;
    else el.value = '';
  });
  applyFilters();
}

init();
</script>
</body>
</html>
