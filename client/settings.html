<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Settings — FundTrace Bank</title>
<link rel="stylesheet" href="/client/css/app.css">
</head>
<body>
<div class="topbar">
  <div class="topbar-logo"><span class="logo-dot"></span> FundTrace Bank</div>
  <nav style="display:flex; gap:4px; margin-left:16px;">
    <a href="/client/dashboard.html" class="nav-item" style="padding:6px 12px; font-size:13px;">Dashboard</a>
    <a href="/client/transactions.html" class="nav-item" style="padding:6px 12px; font-size:13px;">Transactions</a>
    <a href="/client/friends.html" class="nav-item" style="padding:6px 12px; font-size:13px;">Connections</a>
    <a href="/client/settings.html" class="nav-item active" style="padding:6px 12px; font-size:13px;">Settings</a>
  </nav>
  <div class="topbar-right">
    <span class="topbar-name" id="topbarName">Loading...</span>
    <button class="btn btn-sm" onclick="logout()">Sign out</button>
  </div>
  </div>

<div style="max-width:720px; margin:0 auto; padding:24px;">
  <div class="section-header">
    <span class="section-title">Account Settings</span>
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label class="form-label">Full name</label>
      <input type="text" id="full_name" class="form-input" placeholder="Your name">
    </div>
    <div class="form-group">
      <label class="form-label">Phone number</label>
      <input type="tel" id="phone" class="form-input" placeholder="+91 9876543210">
    </div>
  </div>

  <div class="grid-2">
    <div class="form-group">
      <label class="form-label">Current password</label>
      <input type="password" id="password_old" class="form-input" placeholder="Enter current password">
    </div>
    <div class="form-group">
      <label class="form-label">New password</label>
      <input type="password" id="password_new" class="form-input" placeholder="Enter new password">
    </div>
  </div>

  <div class="form-error" id="settingsError"></div>
  <div style="display:flex; gap:8px;">
    <button class="btn btn-primary" id="saveBtn" onclick="saveSettings()">Save changes</button>
    <button class="btn" onclick="loadMe()">Reset</button>
  </div>

  <div style="margin-top:24px;">
    <div class="section-header">
      <span class="section-title">Profile</span>
    </div>
    <div class="stat-card">
      <div style="font-size:13px; color:var(--text2);">Email</div>
      <div id="email" style="font-weight:500;"></div>
      <div style="font-size:13px; color:var(--text2); margin-top:12px;">Account</div>
      <div id="account_number" class="font-mono" style="font-weight:500;"></div>
      <div style="font-size:13px; color:var(--text2); margin-top:12px;">FundTrace ID</div>
      <div id="unique_code" style="font-weight:500;"></div>
    </div>
  </div>
</div>

<script src="/client/js/api.js"></script>
<script>
let currentUser = null;

async function init() {
  currentUser = await requireLogin('client');
  if (!currentUser) return;
  document.getElementById('topbarName').textContent = currentUser.full_name.split(' ')[0];
  loadMe();
}

async function loadMe() {
  try {
    const { user } = await api.get('/auth/me');
    currentUser = user;
    document.getElementById('full_name').value = user.full_name || '';
    document.getElementById('phone').value = user.phone || '';
    document.getElementById('email').textContent = user.email || '';
    document.getElementById('account_number').textContent = user.account_number || '';
    document.getElementById('unique_code').textContent = user.unique_code || '';
  } catch (e) {}
}

async function saveSettings() {
  const btn = document.getElementById('saveBtn');
  setLoading(btn, true, 'Saving...');
  clearError('settingsError');
  const data = {
    full_name: document.getElementById('full_name').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    password_old: document.getElementById('password_old').value,
    password_new: document.getElementById('password_new').value
  };
  if (!data.full_name && !data.phone && !data.password_new) {
    showError('settingsError', 'Provide at least one field to update');
    setLoading(btn, false);
    return;
  }
  try {
    const res = await api.patch('/auth/profile', data);
    showToast('Settings updated', 'success');
    document.getElementById('password_old').value = '';
    document.getElementById('password_new').value = '';
    loadMe();
  } catch (e) {
    showError('settingsError', e.message);
  } finally {
    setLoading(btn, false);
  }
}

init();
</script>
</body>
</html>
